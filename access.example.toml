[access]
# Number of WebSocket tunnels opened to each gateway. Increase for many concurrent SSH/TCP streams.
gateway_pool_size = 8

[[gateways]]
name = "primary"
server_url = "ws://127.0.0.1:8443/tunnel"
token = "change-primary-access-token"
# token 对应 gateway 的 auth.access_token。
# gateway 的 auth.enabled = true 时，还必须填写用户 Token；false 时可省略。
# user_token = "ws-net-gateway adduser 返回的用户token"

[[gateways]]
name = "secondary"
server_url = "ws://127.0.0.1:8444/tunnel"
token = "change-secondary-access-token"
# user_token = "可与 primary 使用相同的用户token，但需在各 gateway 分别配置"

[[listeners]]
name = "mysql"
mode = "tcp"
gateway = "primary"
listen = "127.0.0.1:3308"
host = "10.0.0.10"
port = 3306

[[listeners]]
name = "redis"
mode = "tcp"
gateway = "secondary"
listen = "127.0.0.1:63790"
host = "10.0.0.11"
port = 6379

[[listeners]]
name = "admin"
mode = "http"
gateway = "primary"
listen = "127.0.0.1:18080"
scheme = "https"
host = "admin.internal.local"
port = 443
rewrite_location = true
rewrite_cookie = true

# Local HTTPS listener with an in-memory self-signed certificate.
# Add a hosts entry such as: 127.0.0.1 admin.internal.local
# Then open: https://admin.internal.local:18443
[[listeners]]
name = "admin-local-https"
mode = "http"
gateway = "primary"
listen = "127.0.0.1:18443"
local_scheme = "https"
auto_cert = true
scheme = "https"
host = "admin.internal.local"
port = 443
rewrite_location = true
rewrite_cookie = true
